name: Sync Amazon prices

on:
  workflow_dispatch:
  schedule:
    # 4 times a day: 05:17, 11:17, 17:17, 23:17 IST (00:17 UTC + offset)
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest Amazon prices
        run: node scripts/sync-prices.mjs

      - name: Commit price changes if any
        run: |
          if git diff --quiet data/live-prices.json; then
            echo "No price changes — nothing to commit."
          else
            git config user.name "unismart-price-bot"
            git config user.email "price-bot@unismart.store"
            git add data/live-prices.json
            git commit -m "chore(price-sync): refresh prices from Amazon"
            git push
            echo "Price changes committed and deployment triggered."
          fi